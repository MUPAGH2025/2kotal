name: test.yml
on: push
jobs:
  pdf:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install ipykernel scipy pint open_atmos_jupyter_utils numpy PyMPDATA
      - run: sudo apt-get install texlive-xetex inkscape pandoc
      - run: pip install nbconvert
      - run: jupyter nbconvert --to latex --no-input --execute PROJEKT_Aleksandra_Kot.ipynb
      - run: sed -i '/HBox(children=/d' PROJEKT_Aleksandra_Kot.tex
      - run: sed -i 's/\\title{PROJEKT}/\\title{Modelowanie układów przepływowych - Projekt pierwszy}\\author{Aleksandra Kot}/' PROJEKT_Aleksandra_Kot.tex
      - name: Add LaTeX Captions using Python
        run: |
          python <<'EOF'
          import sys

          # Definicje podpisów z LaTeX-ową matematyką
          CAPTIONS = [
              r"Rozkład wysokości powierzchni swobodnej $\zeta = h - bath$ dla wybranych chwil czasowych.",
              r"Pola wektorowe prędkości przepływu dla wybranych chwil czasowych.",
              r"Przekrój wysokości powierzchni swobodnej $\zeta(x)$ w połowie domeny ($y=0.5$m).",
              r"Przekrój wysokości powierzchni swobodnej $\zeta(y)$ nad dołkiem ($x=0.9$m)."
          ]

          TEX_FILE = 'PROJEKT_Aleksandra_Kot.tex'
          
          try:
              print(f"Otwieranie pliku: {TEX_FILE}")
              with open(TEX_FILE, 'r', encoding='utf-8') as f:
                  lines = f.readlines()
              
              output_lines = []
              caption_index = 0
              i = 0
              
              # Szablony LaTeX
              LATEX_FIGURE_START = r'\begin{figure}[htbp]' + '\n' + r'\centering' + '\n'
              LATEX_FIGURE_END_TEMPLATE = r'\caption{{{0}}}' + '\n' + r'\label{{{1}}}' + '\n' + r'\end{figure}' + '\n'

              while i < len(lines):
                  line = lines[i]
                  
                  # Sprawdź czy linia zawiera grafikę
                  is_image = ('\\includegraphics' in line) or ('\\adjustimage' in line)
                  
                  if is_image and caption_index < len(CAPTIONS):
                      # Sprawdź otoczenie \begin{center} ... \end{center}
                      prev_line_is_center = (len(output_lines) > 0 and '\\begin{center}' in output_lines[-1])
                      
                      next_line_is_center_end = False
                      if i + 1 < len(lines):
                          if '\\end{center}' in lines[i+1]:
                              next_line_is_center_end = True
                      
                      caption_text = CAPTIONS[caption_index]
                      label_text = f"fig:{caption_index+1}"
                      
                      # Budujemy blok figure - używamy formatowania stringów zamiast f-string dla przejrzystości LaTeXa
                      figure_block_end = LATEX_FIGURE_END_TEMPLATE.format(caption_text, label_text)

                      if prev_line_is_center and next_line_is_center_end:
                          # Podmieniamy ostatnią linię (która jest \begin{center}) na \begin{figure}
                          output_lines[-1] = LATEX_FIGURE_START
                          
                          # Dodajemy obrazek
                          output_lines.append(line)
                          
                          # Dodajemy podpis i zamykamy figure
                          output_lines.append(figure_block_end)
                          
                          # Pomijamy linię \end{center} z wejścia
                          i += 2 
                          caption_index += 1
                          continue
                          
                      else:
                          # Obrazek luzem - otaczamy nowym środowiskiem
                          output_lines.append(LATEX_FIGURE_START)
                          output_lines.append(line)
                          output_lines.append(figure_block_end)
                          
                          i += 1
                          caption_index += 1
                          continue

                  output_lines.append(line)
                  i += 1

              with open(TEX_FILE, 'w', encoding='utf-8') as f:
                  f.writelines(output_lines)
              
              print(f"Sukces. Dodano {caption_index} podpisów.")
              
          except Exception as e:
              print(f"Błąd krytyczny w skrypcie Python: {e}")
              sys.exit(1)
          EOF

      - run: xelatex -interaction=nonstopmode PROJEKT_Aleksandra_Kot.tex
      - run: xelatex -interaction=nonstopmode PROJEKT_Aleksandra_Kot.tex

      - uses: actions/upload-artifact@v4
        with:
          name: raport
          path: PROJEKT_Aleksandra_Kot.pdf