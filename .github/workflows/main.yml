name: test.yml
on: push
jobs:
  pdf:
    runs-on: ubuntu-22.04
    steps:
      - run: pip install ipykernel scipy pint open_atmos_jupyter_utils numpy PyMPDATA
      - uses: actions/checkout@v4
      - run: sudo apt-get install texlive-xetex inkscape pandoc
      - run: pip install nbconvert
      - run: python -m nbconvert --to pdf --execute lab3projekt01.ipynb
      - uses: actions/upload-artifact@v4
        with:
          path: lab3projekt01.pdf